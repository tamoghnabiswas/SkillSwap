<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSwap — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <nav class="nav">
        <a class="brand" href="home.html"><span class="mark">S</span> SkillSwap</a>
        <div class="nav-links">
          <a class="ghost" href="home.html">Home</a>
          <a class="ghost" href="connections.html">Connections</a>
          <button class="ghost" id="logoutBtn" type="button">Log out</button>
        </div>
      </nav>
      <main class="wrap">
        <p class="eyebrow">Chat</p>
        <h1 class="page-title" id="chatTitle">Chat</h1>
        <p class="sub" id="chatSub"></p>

        <div class="chat-messages" id="chatMessages"></div>

        <form class="chat-form" id="chatForm">
          <label class="btn-outline attach-btn" for="fileInput">Attach</label>
          <input type="file" id="fileInput" class="hidden" />
          <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off" />
          <button class="btn" type="submit">Send</button>
        </form>
        <p class="muted" id="fileLabel" style="margin-top:8px"></p>
        <p class="note" id="chatNote"></p>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
