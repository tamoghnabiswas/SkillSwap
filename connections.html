<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSwap — Your connections</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <nav class="nav">
        <a class="brand" href="home.html"><span class="mark">S</span> SkillSwap</a>
        <div class="nav-links">
          <a class="ghost" href="home.html">Home</a>
          <a class="ghost" href="find-peer.html">Find a peer</a>
          <button class="ghost" id="logoutBtn" type="button">Log out</button>
        </div>
      </nav>
      <main class="wrap">
        <p class="eyebrow">Your circle</p>
        <h1 class="page-title">Your connections.</h1>
        <p class="sub">Accept requests from peers, then chat with the ones you are connected to.</p>

        <section id="requestsSection" class="hidden">
          <h2 style="margin:36px 0 16px;font-family:var(--font-display)">Pending requests</h2>
          <div class="conn-grid" id="reqGrid"></div>
        </section>

        <h2 style="margin:36px 0 16px;font-family:var(--font-display)">Connected peers</h2>
        <div class="conn-grid" id="connGrid"></div>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script src="js/connections.js"></script>
  </body>
</html>
